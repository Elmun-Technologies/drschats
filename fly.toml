# Go Vita storefront on Fly.io — setup and secrets: docs/DEPLOY-FLY.md
app = "govita"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Public, non-secret values inlined into the browser bundle at build time.
# Uncomment and fill as each integration goes live; a change needs a redeploy.
[build.args]
  NEXT_PUBLIC_SITE_URL = "https://www.govita.uz"
  CSP_MODE = "report-only"
  # NEXT_PUBLIC_GTM_ID = "GTM-XXXXXXX"
  # NEXT_PUBLIC_GA4_ID = "G-XXXXXXXXXX"
  # NEXT_PUBLIC_META_PIXEL_ID = ""
  # NEXT_PUBLIC_YANDEX_METRIKA_ID = ""
  # NEXT_PUBLIC_TELEGRAM_BOT_USERNAME = "govita_bot"
  # NEXT_PUBLIC_PAYME_MERCHANT_ID = ""
  # NEXT_PUBLIC_CLICK_MERCHANT_ID = ""
  # NEXT_PUBLIC_UZUM_MERCHANT_ID = ""
  # STORAGE_PUBLIC_URL = ""

# Schema changes are applied once per deploy, before new machines take traffic.
# A failed migration stops the deploy; the running version keeps serving.
[deploy]
  release_command = "node scripts/db/migrate.mjs"
  strategy = "rolling"

[env]
  GOVITA_PRODUCTION = "1"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  # A shop takes orders at night too: keep one machine warm, no cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/uz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
