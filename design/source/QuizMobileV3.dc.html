<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E4E6E8; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px"><button type="button" class="btn-l" style="height: 52px">Oʻtkazish</button><a class="btn" href="QuizMobileV3.dc.html" style="height: 52px; border-radius: 14px">Keyingi</a></div>
