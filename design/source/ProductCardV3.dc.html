<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Mahsulot kartasi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
.pc-img{display:block;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#F1F3F0}
.pc-img img{width:100%;height:100%;object-fit:contain;padding:9%;box-sizing:border-box;display:block;transition:transform .2s}
.pc-img:hover img{transform:scale(1.03)}
.pc-buy{width:100%;height:44px;border-radius:12px;border:0;background:#F1F3F0;color:#17191B;font:600 15px Onest,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.pc-buy:hover{background:#17191B;color:#FFFFFF}
</style>
</helmet>
<article style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; background: {{bg}}; border-radius: 20px; padding: {{pad}}; font-family: Onest, 'Segoe UI', Arial, sans-serif; color: #17191B">
<div style="position: relative">
<a class="pc-img" href="{{p.href}}" aria-label="{{p.name}}"><img src="{{p.img}}" alt="{{p.name}}"></a>
<button type="button" aria-label="Sevimlilarga qoʻshish" style="position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 18px; border: 0; background: #FFFFFF; color: {{heartColor}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-shadow: 0 1px 4px rgba(23,25,27,.08)">
<svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: {{heartFill}}; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
<div style="position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px">
<sc-if value="{{hasDisc}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; background: #C8161D; color: #FFFFFF; font-size: 13px; font-weight: 700">{{disc}}</span></sc-if>
<sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; background: #FFD43B; color: #17191B; font-size: 13px; font-weight: 700">{{p.badge}}</span></sc-if>
</div>
</div>
<div style="display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 6px 2px 0">
<span style="font-size: {{priceSize}}; line-height: 26px; font-weight: 700; white-space: nowrap">{{price}} soʻm</span>
<sc-if value="{{hasOld}}" hint-placeholder-val="{{true}}"><span style="font-size: 14px; color: #63686E; text-decoration: line-through; white-space: nowrap">{{old}}</span></sc-if>
</div>
<span style="padding: 0 2px; font-size: 13px; line-height: 17px; min-height: 17px; color: #63686E; margin-top: -4px">{{unitPrice}}</span>
<a href="{{p.href}}" style="padding: 0 2px; font-size: 15px; line-height: 20px; color: #2E3236; text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px">{{p.name}}</a>
<span style="padding: 0 2px; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 17px; color: #63686E"><svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>24 soatda yetkazish</span>
<div style="margin-top: auto; padding-top: 6px">
<sc-if value="{{inCart}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; border-radius: 12px; background: #17191B; color: #FFFFFF">
<button type="button" aria-label="Kamaytirish" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; font: 500 20px Onest, sans-serif; cursor: pointer; padding: 0">−</button>
<span style="font-size: 15px; font-weight: 600">{{qty}} dona</span>
<button type="button" aria-label="Koʻpaytirish" style="width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF; font: 500 20px Onest, sans-serif; cursor: pointer; padding: 0">+</button>
</div>
</sc-if>
<sc-if value="{{notInCart}}" hint-placeholder-val="{{true}}">
<button type="button" class="pc-buy"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Savatga</button>
</sc-if>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"onCard":{"editor":"toggle","default":false},"$preview":{"width":232,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props.item ?? { brand: "Dr. Frei", origin: "Shveytsariya", name: "Antistress Magniy B6, 20 shipuchi tabletka", price: 79000, old: 89000, units: 20, unitLabel: "tabletka", badge: "Xit", img: "/_blob/7fa443751ead07cf3001b38138954042", href: "ProductV3.dc.html" };
    var on = !!this.props.onCard;
    var fmt = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
    var disc = p.old ? Math.round((1 - p.price / p.old) * 100) : 0;
    return {
      p: p, price: fmt(p.price), old: p.old ? fmt(p.old) : "", hasOld: !!p.old,
      hasDisc: disc > 0, disc: "−" + disc + "%", hasBadge: !!p.badge,
      unitPrice: p.units ? fmt(p.price / p.units) + " soʻm / " + p.unitLabel : " ",
      inCart: !!p.inCart, notInCart: !p.inCart, qty: p.qty || 1,
      heartColor: p.fav ? "#C8161D" : "#17191B", heartFill: p.fav ? "#C8161D" : "none",
      priceSize: p.compact ? "18px" : "20px",
      bg: on ? "#FFFFFF" : "transparent", pad: on ? "10px 10px 14px" : "0"
    };
  }
}
</script>
</body>
</html>
