name: Deploy to Fly

# Deploys main to Fly.io once the FLY_API_TOKEN repository secret exists
# (fly tokens create deploy -x 999999h). Until then the job skips cleanly.
#
# Runs after CI, not alongside it: a push to main deploys only once every CI
# job for that commit has passed, and it deploys exactly that commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: echo "present=$([ -n "$FLY_API_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'yes'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.token.outputs.present == 'yes'

      - name: Deploy
        if: steps.token.outputs.present == 'yes'
        run: flyctl deploy --remote-only

  # The Telegram club bot (govita-vip-bot/, app govita-bot). Its own deploy
  # token (fly tokens create deploy -a govita-bot) in FLY_BOT_API_TOKEN;
  # without it the job skips, like the site's.
  deploy-bot:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_BOT_API_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: echo "present=$([ -n "$FLY_API_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'yes'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.token.outputs.present == 'yes'

      - name: Deploy bot
        if: steps.token.outputs.present == 'yes'
        working-directory: govita-vip-bot
        run: flyctl deploy --remote-only
