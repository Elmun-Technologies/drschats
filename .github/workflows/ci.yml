name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI checks code, it never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The other "audit" job in this file measures what the site renders. This
      # one measures what it is built from, and they are not the same thing:
      # a critical framework advisory sat unpatched here for want of a step
      # that would have named it.
      #
      # Not a bare `npm audit --audit-level=high` — that fails on the first run
      # and stays failing, because the Sanity CLI chain has no fix short of a
      # major CMS migration, and a permanently red check gets ignored. This
      # gates everything fixable now and holds the rest in a baseline that
      # fails when a row goes stale. See scripts/audit/deps.mjs.
      - name: Dependency audit
        run: npm run audit:deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The quality table in CLAUDE.md claims a row of zeros. This is what keeps
  # that claim true. Measured against a production build: a dev build has
  # different CSS and different timing, so it would be measuring something else.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve and audit
        run: |
          npx next start -p 3000 &
          npx --yes wait-on http://localhost:3000/uz --timeout 90000
          npm run audit
        env:
          BASE_URL: http://localhost:3000

  # Sign-in codes, their rate limits and the bot webhook are places where a
  # regression is a security bug rather than a cosmetic one, so they get run
  # on every change rather than trusted.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

  # The Telegram club bot ships from this repository too (fly-deploy.yml), so
  # its tests gate the deploy like the site's.
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: govita-vip-bot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: govita-vip-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest -q
